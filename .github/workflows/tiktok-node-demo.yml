name: TikTok Node.js CI Demo
on:
  push:
    branches: [codex/tiktok-node-ci]
    paths: [demos/node-tests/**, .github/workflows/tiktok-node-demo.yml]
  pull_request:
    branches: [main]
    paths: [demos/node-tests/**, .github/workflows/tiktok-node-demo.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: demos/node-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/node-tests/package-lock.json
      - run: npm ci
      - run: npm test
